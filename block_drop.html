<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Block Drop - Classic Puzzle</title>
    <link rel="stylesheet" href="css/dopamine-ui.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2px;
            max-width: 100vw;
            height: 100vh;
            overflow: hidden;
            justify-content: space-between;
        }

        .header {
            text-align: center;
            margin-bottom: 2px;
            flex-shrink: 0;
        }

        .header h1 {
            color: white;
            font-size: clamp(1.2rem, 4vw, 2rem);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin: 0;
        }

        .game-area {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            flex: 1;
            min-height: 0;
        }

        #gameCanvas {
            border: 2px solid #fff;
            border-radius: 5px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            background: #111;
            max-height: calc(100vh - 120px);
            height: auto;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex-shrink: 0;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            padding: 8px 12px;
            min-width: 100px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .info-box h3 {
            margin: 0 0 5px 0;
            color: #667eea;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .score-value {
            font-size: clamp(1.2rem, 3vw, 1.6rem);
            font-weight: bold;
            color: #333;
        }

        .level-value,
        .lines-value {
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            font-weight: bold;
            color: #333;
        }

        .next-preview {
            background: #222;
            border-radius: 5px;
            padding: 10px;
            margin-top: 5px;
        }

        .controls {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            padding: 8px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            flex-shrink: 0;
        }

        .control-btn {
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            touch-action: manipulation;
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .control-btn.wide {
            grid-column: span 3;
        }

        .back-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #667eea;
            border-radius: 8px;
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .mute-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #667eea;
            border-radius: 8px;
            color: #667eea;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.98);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 50;
        }

        .game-over h2 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .game-over button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        @media (max-width: 600px) {
            .game-area {
                flex-direction: column;
                align-items: center;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .side-panel {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
            }

            .controls {
                order: -1;
                margin-bottom: 10px;
            }
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-btn">← Back</a>
    <button class="mute-btn" id="muteBtn" title="Toggle Sound">🔊</button>

    <div class="container">
        <div class="header">
            <h1>Block Drop</h1>
        </div>

        <div class="game-area">
            <canvas id="gameCanvas" width="240" height="480"></canvas>

            <div class="side-panel">
                <div class="info-box">
                    <h3>Score</h3>
                    <div class="score-value" id="score">0</div>
                </div>

                <div class="info-box">
                    <h3>Level</h3>
                    <div class="level-value" id="level">1</div>
                </div>

                <div class="info-box">
                    <h3>Lines</h3>
                    <div class="lines-value" id="lines">0</div>
                </div>

                <div class="info-box">
                    <h3>Next</h3>
                    <canvas id="nextCanvas" class="next-preview" width="80" height="80"></canvas>
                </div>

                <div class="controls">
                    <button class="control-btn" id="leftBtn">←</button>
                    <button class="control-btn" id="rotateBtn">⟳</button>
                    <button class="control-btn" id="rightBtn">→</button>
                    <button class="control-btn wide" id="dropBtn">▼ DROP</button>
                </div>
            </div>
        </div>
    </div>

    <div class="game-over" id="gameOver">
        <h2>Game Over!</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <p>Lines: <span id="finalLines">0</span></p>
        <button onclick="restart()">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('nextCanvas');
        const nextCtx = nextCanvas.getContext('2d');

        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 24;
        const TARGET_FPS = 60;

        // Minimal Sound System
        const sound = {
            ctx: null,
            muted: localStorage.getItem('gameSoundsMuted') === 'true',
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            play(freq, dur, type = 'sine') {
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.frequency.value = freq;
                osc.type = type;
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + dur);
                osc.start();
                osc.stop(this.ctx.currentTime + dur);
            },
            drop: function () { this.play(200, 0.05, 'square'); },
            clear: function () { this.play(600, 0.1); setTimeout(() => this.play(800, 0.1), 50); setTimeout(() => this.play(1000, 0.15), 100); },
            rotate: function () { this.play(600, 0.05, 'square'); },
            over: function () { this.play(300, 0.2, 'sawtooth'); setTimeout(() => this.play(200, 0.2, 'sawtooth'), 100); }
        };
        document.getElementById('muteBtn').onclick = function () {
            sound.muted = !sound.muted;
            localStorage.setItem('gameSoundsMuted', sound.muted);
            this.innerText = sound.muted ? '🔇' : '🔊';
        };
        document.getElementById('muteBtn').innerText = sound.muted ? '🔇' : '🔊';

        // Tetromino shapes
        const SHAPES = {
            I: [[1, 1, 1, 1]],
            O: [[1, 1], [1, 1]],
            T: [[0, 1, 0], [1, 1, 1]],
            S: [[0, 1, 1], [1, 1, 0]],
            Z: [[1, 1, 0], [0, 1, 1]],
            J: [[1, 0, 0], [1, 1, 1]],
            L: [[0, 0, 1], [1, 1, 1]]
        };

        const COLORS = {
            I: '#00f0f0',
            O: '#f0f000',
            T: '#a000f0',
            S: '#00f000',
            Z: '#f00000',
            J: '#0000f0',
            L: '#f0a000'
        };

        let board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
        let score = 0;
        let lines = 0;
        let level = 1;
        let gameOver = false;
        let currentPiece = null;
        let nextPiece = null;
        let dropCounter = 0;
        let dropInterval = 1000; // ms
        let lastTime = 0;

        function getRandomPiece() {
            const shapes = Object.keys(SHAPES);
            const type = shapes[Math.floor(Math.random() * shapes.length)];
            return {
                type: type,
                shape: SHAPES[type],
                color: COLORS[type],
                x: Math.floor(COLS / 2) - Math.floor(SHAPES[type][0].length / 2),
                y: 0
            };
        }

        function drawBlock(ctx, x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.strokeRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);

            // Inner highlight
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(x * BLOCK_SIZE + 2, y * BLOCK_SIZE + 2, BLOCK_SIZE - 4, BLOCK_SIZE - 4);
        }

        function drawBoard() {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    if (board[row][col]) {
                        drawBlock(ctx, col, row, board[row][col]);
                    }
                }
            }
        }

        function drawPiece(piece) {
            piece.shape.forEach((row, dy) => {
                row.forEach((value, dx) => {
                    if (value) {
                        drawBlock(ctx, piece.x + dx, piece.y + dy, piece.color);
                    }
                });
            });
        }

        function drawNext() {
            nextCtx.fillStyle = '#222';
            nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);

            if (nextPiece) {
                const offsetX = (4 - nextPiece.shape[0].length) / 2;
                const offsetY = (4 - nextPiece.shape.length) / 2;

                nextPiece.shape.forEach((row, dy) => {
                    row.forEach((value, dx) => {
                        if (value) {
                            const x = (offsetX + dx) * 20;
                            const y = (offsetY + dy) * 20;
                            nextCtx.fillStyle = nextPiece.color;
                            nextCtx.fillRect(x, y, 18, 18);
                            nextCtx.strokeStyle = '#000';
                            nextCtx.strokeRect(x, y, 18, 18);
                        }
                    });
                });
            }
        }

        function collision(piece, offsetX = 0, offsetY = 0) {
            for (let dy = 0; dy < piece.shape.length; dy++) {
                for (let dx = 0; dx < piece.shape[dy].length; dx++) {
                    if (piece.shape[dy][dx]) {
                        const newX = piece.x + dx + offsetX;
                        const newY = piece.y + dy + offsetY;

                        if (newX < 0 || newX >= COLS || newY >= ROWS) {
                            return true;
                        }
                        if (newY >= 0 && board[newY][newX]) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function merge() {
            currentPiece.shape.forEach((row, dy) => {
                row.forEach((value, dx) => {
                    if (value) {
                        const y = currentPiece.y + dy;
                        const x = currentPiece.x + dx;
                        if (y >= 0) {
                            board[y][x] = currentPiece.color;
                        }
                    }
                });
            });
        }

        function rotate(piece) {
            const rotated = piece.shape[0].map((_, i) =>
                piece.shape.map(row => row[i]).reverse()
            );

            const previousShape = piece.shape;
            piece.shape = rotated;

            if (collision(piece)) {
                piece.shape = previousShape;
            } else {
                sound.rotate();
            }
        }

        function clearLines() {
            let linesCleared = 0;

            for (let row = ROWS - 1; row >= 0; row--) {
                if (board[row].every(cell => cell !== 0)) {
                    board.splice(row, 1);
                    board.unshift(Array(COLS).fill(0));
                    linesCleared++;
                    row++; // Check same row again
                }
            }

            if (linesCleared > 0) {
                lines += linesCleared;
                score += [0, 40, 100, 300, 1200][linesCleared] * level;
                level = Math.floor(lines / 10) + 1;
                dropInterval = Math.max(100, 1000 - (level - 1) * 50);
                sound.clear();
                updateUI();

                // Reward System: Tetris (4 lines)
                if (linesCleared >= 4 && window.rewardSystem) {
                    gameUI.showNotification('TETRIS! +1200', 'legendary');
                } else if (linesCleared >= 2 && window.rewardSystem) {
                    gameUI.showNotification('Combo! +' + (linesCleared * 100), 'rare');
                }
            }
        }

        function move(dir) {
            currentPiece.x += dir;
            if (collision(currentPiece)) {
                currentPiece.x -= dir;
            }
        }

        function drop() {
            currentPiece.y++;
            if (collision(currentPiece)) {
                currentPiece.y--;
                merge();
                clearLines();
                currentPiece = nextPiece;
                nextPiece = getRandomPiece();
                drawNext();

                if (collision(currentPiece)) {
                    gameOver = true;
                    sound.over();
                    showGameOver();
                }
            } else {
                sound.drop();
            }
            dropCounter = 0;
        }

        function hardDrop() {
            while (!collision(currentPiece, 0, 1)) {
                currentPiece.y++;
                score += 2;
            }
            drop();
            updateUI();
        }

        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('lines').textContent = lines;
        }

        function showGameOver() {
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalLines').textContent = lines;
            // document.getElementById('gameOver').style.display = 'block'; // Replaced by RewardSystem

            if (window.rewardSystem) {
                rewardSystem.recordGame('blockDrop', { score: score, lines: lines });

                gameUI.showSummary({
                    score: score,
                    level: level,
                    gameId: 'block_drop',
                    metrics: {
                        'Lines Cleared': lines,
                        'Level Reached': level
                    }
                });
            } else {
                document.getElementById('gameOver').style.display = 'block';
            }
        }

        function restart() {
            board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
            score = 0;
            lines = 0;
            level = 1;
            gameOver = false;
            dropInterval = 1000;
            dropCounter = 0;
            currentPiece = getRandomPiece();
            nextPiece = getRandomPiece();
            document.getElementById('gameOver').style.display = 'none';
            updateUI();
            drawNext();
        }

        function gameLoop(time = 0) {
            if (gameOver) return;

            const deltaTime = time - lastTime;
            lastTime = time;

            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                drop();
            }

            drawBoard();
            if (currentPiece) {
                drawPiece(currentPiece);
            }

            requestAnimationFrame(gameLoop);
        }

        // Keyboard controls
        document.addEventListener('keydown', e => {
            if (gameOver) return;

            switch (e.key) {
                case 'ArrowLeft':
                    move(-1);
                    break;
                case 'ArrowRight':
                    move(1);
                    break;
                case 'ArrowDown':
                    drop();
                    break;
                case 'ArrowUp':
                case ' ':
                    rotate(currentPiece);
                    break;
                case 'Enter':
                    hardDrop();
                    break;
            }
        });

        // Touch controls
        document.getElementById('leftBtn').addEventListener('click', () => move(-1));
        document.getElementById('rightBtn').addEventListener('click', () => move(1));
        document.getElementById('rotateBtn').addEventListener('click', () => rotate(currentPiece));
        document.getElementById('dropBtn').addEventListener('click', hardDrop);

        // Initialize
        currentPiece = getRandomPiece();
        nextPiece = getRandomPiece();
        updateUI();
        drawNext();
        requestAnimationFrame(gameLoop);
    </script>
</body>

<script src="js/data-service.js"></script>
<script src="js/reward-system.js"></script>
<script src="js/particle-system.js"></script>
<script src="js/game-ui.js"></script>
<script>
    // Initialize Reward System
    window.addEventListener('DOMContentLoaded', () => {
        if (window.rewardSystem) {
            rewardSystem.init();
        }
    });
</script>
</body>

</html>
