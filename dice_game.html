<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dice Master - AI Prediction</title>
    <link rel="stylesheet" href="css/dopamine-ui.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .game-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 5px;
            overflow: hidden;
        }

        .header {
            text-align: center;
            padding: 10px 0;
        }

        .header h1 {
            font-size: 1.8rem;
            margin: 0;
            color: #ffd700;
        }

        .header p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin: 0;
        }

        /* Stats Row */
        .stats-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin: 10px 0;
        }

        .stat-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 8px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 2px;
        }

        .stat-value.ai {
            color: #60a5fa;
        }

        .stat-value.user {
            color: #fbbf24;
        }

        /* Dice Area */
        .dice-area {
            flex: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
        }

        .scene {
            width: 80px;
            height: 80px;
            perspective: 300px;
        }

        .cube {
            width: 80px;
            height: 80px;
            position: relative;
            transform-style: preserve-3d;
            transform: translateZ(-40px);
            transition: transform 1s;
        }

        .cube.show-1 {
            transform: translateZ(-40px) rotateY(0deg);
        }

        .cube.show-2 {
            transform: translateZ(-40px) rotateY(-90deg);
        }

        .cube.show-3 {
            transform: translateZ(-40px) rotateY(-180deg);
        }

        .cube.show-4 {
            transform: translateZ(-40px) rotateY(90deg);
        }

        .cube.show-5 {
            transform: translateZ(-40px) rotateX(-90deg);
        }

        .cube.show-6 {
            transform: translateZ(-40px) rotateX(90deg);
        }

        .cube__face {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 2px solid #ecf0f1;
            line-height: 80px;
            font-size: 32px;
            font-weight: bold;
            color: #2c3e50;
            text-align: center;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 8px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.1);
        }

        .cube__face--1 {
            transform: rotateY(0deg) translateZ(40px);
        }

        .cube__face--2 {
            transform: rotateY(90deg) translateZ(40px);
        }

        .cube__face--3 {
            transform: rotateY(180deg) translateZ(40px);
        }

        .cube__face--4 {
            transform: rotateY(-90deg) translateZ(40px);
        }

        .cube__face--5 {
            transform: rotateX(90deg) translateZ(40px);
        }

        .cube__face--6 {
            transform: rotateX(-90deg) translateZ(40px);
        }

        .dot {
            display: block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: #e74c3c;
            position: absolute;
        }

        /* Face 1 */
        .cube__face--1 .dot:nth-child(1) {
            top: 33px;
            left: 33px;
        }

        /* Face 2 */
        .cube__face--2 .dot:nth-child(1) {
            top: 16px;
            left: 16px;
        }

        .cube__face--2 .dot:nth-child(2) {
            bottom: 16px;
            right: 16px;
        }

        /* Face 3 */
        .cube__face--3 .dot:nth-child(1) {
            top: 16px;
            left: 16px;
        }

        .cube__face--3 .dot:nth-child(2) {
            top: 33px;
            left: 33px;
        }

        .cube__face--3 .dot:nth-child(3) {
            bottom: 16px;
            right: 16px;
        }

        /* Face 4 */
        .cube__face--4 .dot:nth-child(1) {
            top: 16px;
            left: 16px;
        }

        .cube__face--4 .dot:nth-child(2) {
            top: 16px;
            right: 16px;
        }

        .cube__face--4 .dot:nth-child(3) {
            bottom: 16px;
            left: 16px;
        }

        .cube__face--4 .dot:nth-child(4) {
            bottom: 16px;
            right: 16px;
        }

        /* Face 5 */
        .cube__face--5 .dot:nth-child(1) {
            top: 16px;
            left: 16px;
        }

        .cube__face--5 .dot:nth-child(2) {
            top: 16px;
            right: 16px;
        }

        .cube__face--5 .dot:nth-child(3) {
            top: 33px;
            left: 33px;
        }

        .cube__face--5 .dot:nth-child(4) {
            bottom: 16px;
            left: 16px;
        }

        .cube__face--5 .dot:nth-child(5) {
            bottom: 16px;
            right: 16px;
        }

        /* Face 6 */
        .cube__face--6 .dot:nth-child(1) {
            top: 16px;
            left: 16px;
        }

        .cube__face--6 .dot:nth-child(2) {
            top: 16px;
            right: 16px;
        }

        .cube__face--6 .dot:nth-child(3) {
            top: 33px;
            left: 16px;
        }

        .cube__face--6 .dot:nth-child(4) {
            top: 33px;
            right: 16px;
        }

        .cube__face--6 .dot:nth-child(5) {
            bottom: 16px;
            left: 16px;
        }

        .cube__face--6 .dot:nth-child(6) {
            bottom: 16px;
            right: 16px;
        }

        /* Controls */
        .controls {
            margin: 15px 0;
        }

        .controls h5 {
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 10px;
            color: #94a3b8;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .btn-number {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            border: 2px solid #fbbf24;
            background: rgba(251, 191, 36, 0.3);
            color: #fbbf24;
            transition: all 0.2s;
        }

        .btn-number.selected {
            transform: scale(1.1);
            border-color: #fbbf24;
            background: #fbbf24;
            color: #1a1a2e;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.5);
        }

        .btn-roll {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            border: none;
            border-radius: 8px;
            color: #1a1a2e;
            font-weight: bold;
            font-size: 1.1rem;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.3);
        }

        .btn-roll:disabled {
            opacity: 0.5;
        }

        /* Compact Results */
        .results {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }

        .result-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
        }

        .result-card .label {
            font-size: 0.7rem;
            color: #94a3b8;
        }

        .result-card .value {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 5px 0;
        }

        .result-card .badge {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 10px;
            display: inline-block;
        }

        .badge-win {
            background: #10b981;
        }

        .badge-lose {
            background: #ef4444;
        }

        .badge-neutral {
            background: #64748b;
        }

        /* Back Button */
        .back-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <a href="index.html" class="back-btn">← Back</a>

    <div class="game-container">
        <div class="header">
            <h1>Dice Master</h1>
            <p>User vs. AI Prediction</p>
        </div>

        <!-- Stats Row -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-label">Your Wins</div>
                <div class="stat-value user" id="user-wins">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">AI Wins</div>
                <div class="stat-value ai" id="ai-wins">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total</div>
                <div class="stat-value" id="total-rolls">0</div>
            </div>
        </div>

        <!-- Dice -->
        <div class="dice-area">
            <div class="scene">
                <div class="cube show-1" id="dice">
                    <div class="cube__face cube__face--1">
                        <div class="dot"></div>
                    </div>
                    <div class="cube__face cube__face--2">
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                    <div class="cube__face cube__face--3">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                    <div class="cube__face cube__face--4">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                    <div class="cube__face cube__face--5">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                    <div class="cube__face cube__face--6">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Predictions -->
        <div class="results">
            <div class="result-card">
                <div class="label">You</div>
                <div class="value user">-</div>
                <div class="badge badge-neutral" id="user-result">Ready</div>
            </div>
            <div class="result-card">
                <div class="label">AI</div>
                <div class="value ai" id="ai-prediction-display">-</div>
                <div class="badge badge-neutral" id="ai-result">Ready</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <h5>Pick a Number</h5>
            <div class="btn-grid">
                <button class="btn-number" onclick="selectNumber(1)">1</button>
                <button class="btn-number" onclick="selectNumber(2)">2</button>
                <button class="btn-number" onclick="selectNumber(3)">3</button>
                <button class="btn-number" onclick="selectNumber(4)">4</button>
                <button class="btn-number" onclick="selectNumber(5)">5</button>
                <button class="btn-number" onclick="selectNumber(6)">6</button>
            </div>
            <button id="roll-btn" class="btn-roll" onclick="rollDice()" disabled>ROLL DICE</button>
        </div>
    </div>

    <!-- Reward System Scripts -->
    <script src="js/data-service.js"></script>
    <script src="js/reward-system.js"></script>
    <script src="js/particle-system.js"></script>
    <script src="js/game-ui.js"></script>

    <script>
        // Game State
        let userSelection = null;
        let isRolling = false;
        let history = [];
        let transitionMatrix = {};

        // Stats
        let totalRolls = 0;
        let userWins = 0;
        let aiWins = 0;

        // DOM Elements
        const dice = document.getElementById('dice');
        const rollBtn = document.getElementById('roll-btn');
        const aiPredictionDisplay = document.getElementById('ai-prediction-display');
        const aiResultEl = document.getElementById('ai-result');
        const userWinsDisplay = document.getElementById('user-wins');
        const totalRollsDisplay = document.getElementById('total-rolls');
        const userResultEl = document.getElementById('user-result');
        const aiWinsDisplay = document.getElementById('ai-wins');

        // User Selection
        function selectNumber(num) {
            if (isRolling) return;
            userSelection = num;

            // Update UI
            document.querySelectorAll('.btn-number').forEach(btn => {
                btn.classList.remove('selected');
                if (parseInt(btn.innerText) === num) {
                    btn.classList.add('selected');
                }
            });

            // Update display
            document.querySelectorAll('.result-card .value')[0].innerText = num;

            rollBtn.disabled = false;

            // Reset badges
            userResultEl.className = 'badge badge-neutral';
            userResultEl.innerText = 'Ready';
            aiResultEl.className = 'badge badge-neutral';
            aiResultEl.innerText = 'Ready';
        }

        // Markov Chain Logic
        function getAiPrediction() {
            if (history.length === 0) return Math.floor(Math.random() * 6) + 1;

            const lastRoll = history[history.length - 1];
            const transitions = transitionMatrix[lastRoll];

            if (!transitions) return Math.floor(Math.random() * 6) + 1;

            let candidates = [];
            let maxCount = -1;

            for (let next in transitions) {
                if (transitions[next] > maxCount) {
                    maxCount = transitions[next];
                    candidates = [parseInt(next)];
                } else if (transitions[next] === maxCount) {
                    candidates.push(parseInt(next));
                }
            }

            if (candidates.length > 0) {
                return candidates[Math.floor(Math.random() * candidates.length)];
            }

            return Math.floor(Math.random() * 6) + 1;
        }

        function updateMarkovModel(prev, current) {
            if (!prev) return;

            if (!transitionMatrix[prev]) {
                transitionMatrix[prev] = {};
            }
            if (!transitionMatrix[prev][current]) {
                transitionMatrix[prev][current] = 0;
            }
            transitionMatrix[prev][current]++;
        }

        // Dice Logic
        function rollDice() {
            if (isRolling || !userSelection) return;
            isRolling = true;
            rollBtn.disabled = true;

            const aiPrediction = getAiPrediction();
            aiPredictionDisplay.innerText = aiPrediction;

            const result = Math.floor(Math.random() * 6) + 1;

            dice.style.transition = 'transform 1s ease-out';

            let finalX = 0;
            let finalY = 0;

            switch (result) {
                case 1: finalX = 0; finalY = 0; break;
                case 2: finalX = 0; finalY = -90; break;
                case 3: finalX = 0; finalY = -180; break;
                case 4: finalX = 0; finalY = 90; break;
                case 5: finalX = -90; finalY = 0; break;
                case 6: finalX = 90; finalY = 0; break;
            }

            dice.style.transform = `translateZ(-40px) rotateX(${finalX + 360 * 5}deg) rotateY(${finalY + 360 * 5}deg)`;

            setTimeout(() => {
                finishRoll(result, aiPrediction);
            }, 1000);
        }

        function finishRoll(result, aiPrediction) {
            isRolling = false;
            rollBtn.disabled = false;

            totalRolls++;

            if (history.length > 0) {
                updateMarkovModel(history[history.length - 1], result);
            }
            history.push(result);

            const userWon = (userSelection === result);
            const aiWon = (aiPrediction === result);

            if (userWon) userWins++;
            if (aiWon) aiWins++;

            updateStats(userWon, aiWon);

            // Dopamine triggers
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            if (userWon) {
                particles.confetti(centerX, centerY, 30);
                gameUI.showFloatingText('YOU WIN!', centerX, centerY - 50, '#ffd700', '36px');

                // Win streak celebration
                if (userWins % 3 === 0 && userWins > 0) {
                    gameUI.showFloatingText(`${userWins} WIN STREAK!`, centerX, centerY + 50, '#ff6b00', '28px');
                    particles.fire(centerX, centerY, 25);
                }
            } else if (aiWon) {
                particles.sparkle(centerX, centerY, 10, '#60a5fa');
            }

            // Record game in reward system
            (async () => {
                try {
                    await rewardSystem.recordGame('diceMaster', { won: userWon });
                    const player = rewardSystem.player;
                    const xpInfo = rewardSystem.getXPForNextLevel();
                    gameUI.updateXP(player.xp, xpInfo.needed, xpInfo.total);
                    gameUI.updateLevel(player.level);

                    const unseenAchievements = rewardSystem.getUnseenAchievements();
                    for (const achievement of unseenAchievements) {
                        setTimeout(() => gameUI.showAchievement(achievement), 500);
                    }
                    if (unseenAchievements.length > 0) {
                        await rewardSystem.markAchievementsSeen(unseenAchievements.map(a => a.id));
                    }
                } catch (error) {
                    console.error('Error recording game:', error);
                }
            })();
        }

        function updateStats(userWon, aiWon) {
            userWinsDisplay.innerText = userWins;
            aiWinsDisplay.innerText = aiWins;
            totalRollsDisplay.innerText = totalRolls;

            if (userWon) {
                userResultEl.className = 'badge badge-win';
                userResultEl.innerText = 'WIN';
            } else {
                userResultEl.className = 'badge badge-lose';
                userResultEl.innerText = 'LOSE';
            }

            if (aiWon) {
                aiResultEl.className = 'badge badge-win';
                aiResultEl.innerText = 'WIN';
            } else {
                aiResultEl.className = 'badge badge-lose';
                aiResultEl.innerText = 'LOSE';
            }
        }

        // Initialize reward system
        (async () => {
            try {
                await rewardSystem.init();
                const player = rewardSystem.player;
                const xpInfo = rewardSystem.getXPForNextLevel();
                gameUI.updateXP(player.xp, xpInfo.needed, xpInfo.total);
                gameUI.updateLevel(player.level);
                gameUI.updateStreak(player.streak.current);
                rewardSystem.on('level_up', (data) => {
                    gameUI.showLevelUp(data.oldLevel, data.newLevel);
                });
            } catch (error) {
                console.error('Failed to initialize reward system:', error);
            }
        })();

    </script>
</body>

</html>
