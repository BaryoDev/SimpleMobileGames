<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Master - Learning AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 5px;
            gap: 5px;
        }

        .header {
            text-align: center;
            padding: 5px;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            color: #f7fafc;
            margin: 0;
        }

        .game-area {
            display: flex;
            gap: 8px;
            flex: 1;
            min-height: 0;
            justify-content: center;
        }

        .board-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .chess-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            border: 3px solid #718096;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            aspect-ratio: 1;
            max-width: min(90vw, 60vh);
            max-height: min(90vw, 60vh);
        }

        .square {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(2rem, 6vw, 3.5rem);
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        .square.light {
            background: #f0d9b5;
        }

        .square.dark {
            background: #b58863;
        }

        .square.selected {
            background: #7fa650 !important;
        }

        .square.valid-move {
            background: #9bc158 !important;
        }

        .square.last-move {
            background: #cdd26a !important;
        }

        .piece {
            cursor: grab;
            transition: transform 0.1s;
        }

        .piece:active {
            transform: scale(1.1);
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 150px;
            max-width: 200px;
            flex-shrink: 0;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px;
            backdrop-filter: blur(10px);
        }

        .info-box h3 {
            font-size: 0.8rem;
            color: #cbd5e0;
            margin-bottom: 5px;
        }

        .move-history {
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.75rem;
            line-height: 1.4;
        }

        .button {
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .button:active {
            transform: scale(0.95);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: #2d3748;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            max-width: 90%;
        }

        .coin-container {
            width: 100px;
            height: 100px;
            margin: 20px auto;
            perspective: 1000px;
        }

        .coin {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.5);
            transform-style: preserve-3d;
            animation: flip 1s ease-in-out;
        }

        @keyframes flip {
            0% {
                transform: rotateY(0deg);
            }

            100% {
                transform: rotateY(1800deg);
            }
        }

        .promotion-pieces {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 10px 0;
        }

        .promotion-piece {
            font-size: 3rem;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
        }

        .promotion-piece:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .back-btn,
        .mute-btn {
            position: absolute;
            top: 10px;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #667eea;
            border-radius: 8px;
            color: #667eea;
            font-weight: bold;
            z-index: 100;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .back-btn {
            left: 10px;
            text-decoration: none;
        }

        .mute-btn {
            right: 10px;
            font-size: 1.2rem;
        }

        @media (max-width: 700px) {
            .game-area {
                flex-direction: column;
                align-items: center;
            }

            .side-panel {
                max-width: 100%;
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-btn">← Back</a>
    <button class="mute-btn" id="muteBtn">🔊</button>

    <div class="container">
        <div class="header">
            <h1>♔ Chess Master ♚</h1>
        </div>

        <div class="game-area">
            <div class="board-container">
                <div class="chess-board" id="chessBoard"></div>
            </div>

            <div class="side-panel">
                <div class="info-box">
                    <h3>Turn</h3>
                    <div id="turnDisplay">-</div>
                </div>
                <div class="info-box">
                    <h3>Move History</h3>
                    <div class="move-history" id="moveHistory"></div>
                </div>
                <div class="info-box">
                    <button class="button" onclick="exportPGN()">📥 Export PGN</button>
                    <button class="button" onclick="newGame()" style="margin-top: 5px;">🔄 New Game</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Coin Toss Modal -->
    <div class="modal" id="coinModal">
        <div class="modal-content">
            <h2>Choose Your Side</h2>
            <p>Flipping coin...</p>
            <div class="coin-container">
                <div class="coin" id="coin">♔</div>
            </div>
            <div id="coinResult"></div>
        </div>
    </div>

    <!-- Promotion Modal -->
    <div class="modal" id="promotionModal" style="display: none;">
        <div class="modal-content">
            <h2>Promote Pawn</h2>
            <div class="promotion-pieces" id="promotionPieces"></div>
        </div>
    </div>

    <script>
        // Sound System
        const sound = {
            ctx: null,
            muted: localStorage.getItem('gameSoundsMuted') === 'true',
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            play(freq, dur, type = 'sine', vol = 0.15) {
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.frequency.value = freq;
                osc.type = type;
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + dur);
                osc.start();
                osc.stop(this.ctx.currentTime + dur);
            },
            move: function () { this.play(600, 0.1, 'sine', 0.2); },
            capture: function () { this.play(400, 0.15, 'square', 0.25); },
            check: function () { this.play(800, 0.2, 'sine', 0.3); },
            gameOver: function () {
                this.play(400, 0.3, 'sawtooth', 0.3);
                setTimeout(() => this.play(300, 0.3, 'sawtooth', 0.3), 150);
            }
        };

        document.getElementById('muteBtn').onclick = function () {
            sound.muted = !sound.muted;
            localStorage.setItem('gameSoundsMuted', sound.muted);
            this.innerText = sound.muted ? '🔇' : '🔊';
        };
        document.getElementById('muteBtn').innerText = sound.muted ? '🔇' : '🔊';

        // Chess pieces (Unicode)
        const pieces = {
            'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙',
            'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟'
        };

        // Game state
        let board = [];
        let currentTurn = 'white';
        let playerColor = 'white';
        let selectedSquare = null;
        let moveHistory = [];
        let gameActive = false;
        let lastMove = null;

        // AI Learning Data
        let aiMemory = JSON.parse(localStorage.getItem('chessAI') || '{"openings":{},"wins":0,"losses":0,"draws":0}');

        // Initialize board
        function initBoard() {
            board = [
                ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'],
                ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
                [' ', ' ', ' ', ' ', ' ', ' ', ' ', ' '],
                [' ', ' ', ' ', ' ', ' ', ' ', ' ', ' '],
                [' ', ' ', ' ', ' ', ' ', ' ', ' ', ' '],
                [' ', ' ', ' ', ' ', ' ', ' ', ' ', ' '],
                ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'],
                ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']
            ];
            moveHistory = [];
            currentTurn = 'white';
            lastMove = null;
            renderBoard();
            updateTurnDisplay();
        }

        // Render board
        function renderBoard() {
            const boardEl = document.getElementById('chessBoard');
            boardEl.innerHTML = '';

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const square = document.createElement('div');
                    square.className = 'square ' + ((row + col) % 2 === 0 ? 'light' : 'dark');
                    square.dataset.row = row;
                    square.dataset.col = col;

                    const piece = board[row][col];
                    if (piece !== ' ') {
                        const pieceEl = document.createElement('span');
                        pieceEl.className = 'piece';
                        pieceEl.textContent = pieces[piece];
                        square.appendChild(pieceEl);
                    }

                    square.onclick = () => handleSquareClick(row, col);
                    boardEl.appendChild(square);
                }
            }

            // Highlight last move
            if (lastMove) {
                document.querySelector(`[data-row="${lastMove.from.row}"][data-col="${lastMove.from.col}"]`).classList.add('last-move');
                document.querySelector(`[data-row="${lastMove.to.row}"][data-col="${lastMove.to.col}"]`).classList.add('last-move');
            }
        }

        // Handle square clicks
        function handleSquareClick(row, col) {
            if (!gameActive) return;
            if (currentTurn !== playerColor) return;

            const piece = board[row][col];

            if (selectedSquare) {
                // Try to move
                if (isValidMove(selectedSquare.row, selectedSquare.col, row, col)) {
                    makeMove(selectedSquare.row, selectedSquare.col, row, col);
                    clearSelection();

                    // AI move after delay
                    if (gameActive) {
                        setTimeout(() => makeAIMove(), 500);
                    }
                } else {
                    clearSelection();
                }
            } else if (piece !== ' ' && isPlayerPiece(piece)) {
                // Select piece
                selectedSquare = { row, col };
                highlightValidMoves(row, col);
            }
        }

        function isPlayerPiece(piece) {
            return (playerColor === 'white' && piece === piece.toUpperCase()) ||
                (playerColor === 'black' && piece === piece.toLowerCase());
        }

        function highlightValidMoves(row, col) {
            document.querySelectorAll('.square').forEach(sq => {
                sq.classList.remove('selected', 'valid-move');
            });

            document.querySelector(`[data-row="${row}"][data-col="${col}"]`).classList.add('selected');

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (isValidMove(row, col, r, c)) {
                        document.querySelector(`[data-row="${r}"][data-col="${c}"]`).classList.add('valid-move');
                    }
                }
            }
        }

        function clearSelection() {
            selectedSquare = null;
            document.querySelectorAll('.square').forEach(sq => {
                sq.classList.remove('selected', 'valid-move');
            });
        }

        // Move validation (simplified for demo - full chess rules would be much longer)
        function isValidMove(fromRow, fromCol, toRow, toCol) {
            if (fromRow === toRow && fromCol === toCol) return false;

            const piece = board[fromRow][fromCol].toLowerCase();
            const target = board[toRow][toCol];

            // Can't capture own piece
            if (target !== ' ') {
                const targetColor = target === target.toUpperCase() ? 'white' : 'black';
                const pieceColor = board[fromRow][fromCol] === board[fromRow][fromCol].toUpperCase() ? 'white' : 'black';
                if (targetColor === pieceColor) return false;
            }

            switch (piece) {
                case 'p': return isValidPawnMove(fromRow, fromCol, toRow, toCol);
                case 'r': return isValidRookMove(fromRow, fromCol, toRow, toCol);
                case 'n': return isValidKnightMove(fromRow, fromCol, toRow, toCol);
                case 'b': return isValidBishopMove(fromRow, fromCol, toRow, toCol);
                case 'q': return isValidQueenMove(fromRow, fromCol, toRow, toCol);
                case 'k': return isValidKingMove(fromRow, fromCol, toRow, toCol);
            }
            return false;
        }

        function isValidPawnMove(fromRow, fromCol, toRow, toCol) {
            const piece = board[fromRow][fromCol];
            const isWhite = piece === piece.toUpperCase();
            const direction = isWhite ? -1 : 1;
            const startRow = isWhite ? 6 : 1;

            // Move forward
            if (fromCol === toCol && board[toRow][toCol] === ' ') {
                if (toRow === fromRow + direction) return true;
                if (fromRow === startRow && toRow === fromRow + 2 * direction && board[fromRow + direction][fromCol] === ' ') return true;
            }

            // Capture
            if (Math.abs(fromCol - toCol) === 1 && toRow === fromRow + direction && board[toRow][toCol] !== ' ') {
                return true;
            }

            return false;
        }

        function isValidRookMove(fromRow, fromCol, toRow, toCol) {
            if (fromRow !== toRow && fromCol !== toCol) return false;
            return isPathClear(fromRow, fromCol, toRow, toCol);
        }

        function isValidKnightMove(fromRow, fromCol, toRow, toCol) {
            const rowDiff = Math.abs(fromRow - toRow);
            const colDiff = Math.abs(fromCol - toCol);
            return (rowDiff === 2 && colDiff === 1) || (rowDiff === 1 && colDiff === 2);
        }

        function isValidBishopMove(fromRow, fromCol, toRow, toCol) {
            if (Math.abs(fromRow - toRow) !== Math.abs(fromCol - toCol)) return false;
            return isPathClear(fromRow, fromCol, toRow, toCol);
        }

        function isValidQueenMove(fromRow, fromCol, toRow, toCol) {
            return isValidRookMove(fromRow, fromCol, toRow, toCol) || isValidBishopMove(fromRow, fromCol, toRow, toCol);
        }

        function isValidKingMove(fromRow, fromCol, toRow, toCol) {
            return Math.abs(fromRow - toRow) <= 1 && Math.abs(fromCol - toCol) <= 1;
        }

        function isPathClear(fromRow, fromCol, toRow, toCol) {
            const rowStep = toRow > fromRow ? 1 : (toRow < fromRow ? -1 : 0);
            const colStep = toCol > fromCol ? 1 : (toCol < fromCol ? -1 : 0);

            let row = fromRow + rowStep;
            let col = fromCol + colStep;

            while (row !== toRow || col !== toCol) {
                if (board[row][col] !== ' ') return false;
                row += rowStep;
                col += colStep;
            }

            return true;
        }

        // Make move
        function makeMove(fromRow, fromCol, toRow, toCol) {
            const piece = board[fromRow][fromCol];
            const captured = board[toRow][toCol];

            board[toRow][toCol] = piece;
            board[fromRow][fromCol] = ' ';

            lastMove = { from: { row: fromRow, col: fromCol }, to: { row: toRow, col: toCol } };

            // Record move
            const moveNotation = toAlgebraic(fromRow, fromCol, toRow, toCol, piece, captured !== ' ');
            moveHistory.push(moveNotation);
            document.getElementById('moveHistory').textContent = moveHistory.map((m, i) =>
                i % 2 === 0 ? `${Math.floor(i / 2) + 1}. ${m}` : m
            ).join(' ');

            // Learn from move
            if (moveHistory.length <= 4) {
                aiMemory.openings[moveNotation] = (aiMemory.openings[moveNotation] || 0) + 1;
                localStorage.setItem('chessAI', JSON.stringify(aiMemory));
            }

            // Sound
            if (captured !== ' ') sound.capture();
            else sound.move();

            // Check pawn promotion
            if (piece.toLowerCase() === 'p' && (toRow === 0 || toRow === 7)) {
                showPromotionDialog(toRow, toCol);
                return;
            }

            currentTurn = currentTurn === 'white' ? 'black' : 'white';
            renderBoard();
            updateTurnDisplay();
        }

        function toAlgebraic(fromRow, fromCol, toRow, toCol, piece, isCapture) {
            const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
            const pieceSymbol = piece.toUpperCase() === 'P' ? '' : piece.toUpperCase();
            const capture = isCapture ? 'x' : '';
            return `${pieceSymbol}${capture}${files[toCol]}${8 - toRow}`;
        }

        function showPromotionDialog(row, col) {
            const modal = document.getElementById('promotionModal');
            const piecesDiv = document.getElementById('promotionPieces');
            const isWhite = currentTurn === 'white';
            const promotionPieces = isWhite ? ['Q', 'R', 'B', 'N'] : ['q', 'r', 'b', 'n'];

            piecesDiv.innerHTML = promotionPieces.map(p =>
                `<div class="promotion-piece" onclick="promote(${row}, ${col}, '${p}')">${pieces[p]}</div>`
            ).join('');

            modal.style.display = 'flex';
        }

        function promote(row, col, piece) {
            board[row][col] = piece;
            document.getElementById('promotionModal').style.display = 'none';
            currentTurn = currentTurn === 'white' ? 'black' : 'white';
            renderBoard();
            updateTurnDisplay();

            if (currentTurn !== playerColor && gameActive) {
                setTimeout(() => makeAIMove(), 500);
            }
        }

        // Simple AI with minimax (depth 2 for performance)
        function makeAIMove() {
            const aiColor = playerColor === 'white' ? 'black' : 'white';
            const bestMove = findBestMove(aiColor, 2);

            if (bestMove) {
                makeMove(bestMove.from.row, bestMove.from.col, bestMove.to.row, bestMove.to.col);
            }
        }

        function findBestMove(color, depth) {
            let bestScore = -Infinity;
            let bestMove = null;

            for (let fromRow = 0; fromRow < 8; fromRow++) {
                for (let fromCol = 0; fromCol < 8; fromCol++) {
                    const piece = board[fromRow][fromCol];
                    if (piece === ' ') continue;

                    const pieceColor = piece === piece.toUpperCase() ? 'white' : 'black';
                    if (pieceColor !== color) continue;

                    for (let toRow = 0; toRow < 8; toRow++) {
                        for (let toCol = 0; toCol < 8; toCol++) {
                            if (isValidMove(fromRow, fromCol, toRow, toCol)) {
                                // Simulate move
                                const original = board[toRow][toCol];
                                board[toRow][toCol] = piece;
                                board[fromRow][fromCol] = ' ';

                                const score = minimax(depth - 1, -Infinity, Infinity, false, color);

                                // Undo move
                                board[fromRow][fromCol] = piece;
                                board[toRow][toCol] = original;

                                if (score > bestScore) {
                                    bestScore = score;
                                    bestMove = { from: { row: fromRow, col: fromCol }, to: { row: toRow, col: toCol } };
                                }
                            }
                        }
                    }
                }
            }

            return bestMove;
        }

        function minimax(depth, alpha, beta, isMaximizing, aiColor) {
            if (depth === 0) return evaluateBoard(aiColor);

            if (isMaximizing) {
                let maxEval = -Infinity;
                for (let fromRow = 0; fromRow < 8; fromRow++) {
                    for (let fromCol = 0; fromCol < 8; fromCol++) {
                        const piece = board[fromRow][fromCol];
                        if (piece === ' ') continue;
                        const pieceColor = piece === piece.toUpperCase() ? 'white' : 'black';
                        if (pieceColor !== aiColor) continue;

                        for (let toRow = 0; toRow < 8; toRow++) {
                            for (let toCol = 0; toCol < 8; toCol++) {
                                if (!isValidMove(fromRow, fromCol, toRow, toCol)) continue;

                                const original = board[toRow][toCol];
                                board[toRow][toCol] = piece;
                                board[fromRow][fromCol] = ' ';

                                maxEval = Math.max(maxEval, minimax(depth - 1, alpha, beta, false, aiColor));

                                board[fromRow][fromCol] = piece;
                                board[toRow][toCol] = original;

                                alpha = Math.max(alpha, maxEval);
                                if (beta <= alpha) break;
                            }
                        }
                    }
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                const oppColor = aiColor === 'white' ? 'black' : 'white';
                for (let fromRow = 0; fromRow < 8; fromRow++) {
                    for (let fromCol = 0; fromCol < 8; fromCol++) {
                        const piece = board[fromRow][fromCol];
                        if (piece === ' ') continue;
                        const pieceColor = piece === piece.toUpperCase() ? 'white' : 'black';
                        if (pieceColor !== oppColor) continue;

                        for (let toRow = 0; toRow < 8; toRow++) {
                            for (let toCol = 0; toCol < 8; toCol++) {
                                if (!isValidMove(fromRow, fromCol, toRow, toCol)) continue;

                                const original = board[toRow][toCol];
                                board[toRow][toCol] = piece;
                                board[fromRow][fromCol] = ' ';

                                minEval = Math.min(minEval, minimax(depth - 1, alpha, beta, true, aiColor));

                                board[fromRow][fromCol] = piece;
                                board[toRow][toCol] = original;

                                beta = Math.min(beta, minEval);
                                if (beta <= alpha) break;
                            }
                        }
                    }
                }
                return minEval;
            }
        }

        function evaluateBoard(aiColor) {
            const pieceValues = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 100 };
            let score = 0;

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const piece = board[row][col];
                    if (piece === ' ') continue;

                    const value = pieceValues[piece.toLowerCase()];
                    const pieceColor = piece === piece.toUpperCase() ? 'white' : 'black';

                    if (pieceColor === aiColor) score += value;
                    else score -= value;
                }
            }

            return score;
        }

        function updateTurnDisplay() {
            document.getElementById('turnDisplay').textContent =
                `${currentTurn.charAt(0).toUpperCase() + currentTurn.slice(1)} to move`;
        }

        // PGN Export
        function exportPGN() {
            const date = new Date().toISOString().split('T')[0];
            let pgn = `[Event "Chess Master Game"]\n`;
            pgn += `[Date "${date}"]\n`;
            pgn += `[White "${playerColor === 'white' ? 'Player' : 'AI'}"]\n`;
            pgn += `[Black "${playerColor === 'black' ? 'Player' : 'AI'}"]\n\n`;

            for (let i = 0; i < moveHistory.length; i += 2) {
                pgn += `${Math.floor(i / 2) + 1}. ${moveHistory[i]} `;
                if (moveHistory[i + 1]) pgn += `${moveHistory[i + 1]} `;
            }

            const blob = new Blob([pgn], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `chess_game_${date}.pgn`;
            a.click();
        }

        // Coin toss
        function doCoinToss() {
            setTimeout(() => {
                const result = Math.random() < 0.5 ? 'white' : 'black';
                playerColor = result;
                document.getElementById('coin').textContent = result === 'white' ? '♔' : '♚';
                document.getElementById('coinResult').innerHTML =
                    `<h3>You are ${result === 'white' ? 'White' : 'Black'}!</h3>
                     <button class="button" onclick="startGame()">Start Game</button>`;
            }, 1000);
        }

        function startGame() {
            document.getElementById('coinModal').style.display = 'none';
            gameActive = true;
            initBoard();

            if (playerColor === 'black') {
                setTimeout(() => makeAIMove(), 500);
            }
        }

        function newGame() {
            gameActive = false;
            moveHistory = [];
            document.getElementById('moveHistory').textContent = '';
            document.getElementById('coinModal').style.display = 'flex';
            doCoinToss();
        }

        // Initialize
        window.onload = () => {
            initBoard();
            doCoinToss();
        };
    </script>
</body>

</html>
